name: GLIMP TAG Project Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preflight:
    name: Static project and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check validator syntax
        run: python -m py_compile tools/validate_project.py

      - name: Validate Unity project metadata
        run: python tools/validate_project.py --report build/glimp-tag-preflight.json

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glimp-tag-preflight-report
          path: build/glimp-tag-preflight.json
          if-no-files-found: warn
          retention-days: 14
